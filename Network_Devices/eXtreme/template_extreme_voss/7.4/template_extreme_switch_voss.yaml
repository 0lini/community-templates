        - uuid: f6c22c24e9664aeeb861df60e6b70e21
          name: 'Extreme VOSS: EAPOL / 802.1X discovery'
          type: DEPENDENT
          key: extreme.eapol.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#EAPOL.CONTROL}'
                value: '^2$'
                formulaid: A
          description: |
            Discovering EAPOL / 802.1X ports from IEEE8021-PAE-MIB where PortControl is auto(2).
            forceAuthorized / forceUnauthorized ports are skipped.
          item_prototypes:
            - uuid: 4f759abf8cde411298b49811db9f4bb8
              name: 'Extreme VOSS: EAPOL {#SNMPINDEX}: Port status'
              type: DEPENDENT
              key: 'extreme.eapol.port.status[{#SNMPINDEX}]'
              delay: '0'
              history: 30d
              trends: '0'
              description: |
                MIB: IEEE8021-PAE-MIB
                dot1xAuthAuthControlledPortStatus — authorized(1) or unauthorized(2).
                Unauthorized alone is normal when no client is present; see PAE / backend triggers.
              valuemap:
                name: 'IEEE8021-PAE-MIB::PaeControlledPortStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.0.8802.1.1.1.1.2.1.1.5.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: extreme.eapol.walk
              tags:
                - tag: component
                  value: eapol
                - tag: interface
                  value: '{#SNMPINDEX}'
            - uuid: 1d4a98fcf3934912b59f91a026b0ef05
              name: 'Extreme VOSS: EAPOL {#SNMPINDEX}: PAE state'
              type: DEPENDENT
              key: 'extreme.eapol.pae.state[{#SNMPINDEX}]'
              delay: '0'
              history: 30d
              trends: '0'
              description: |
                MIB: IEEE8021-PAE-MIB
                dot1xAuthPaeState — Authenticator PAE state machine.
              valuemap:
                name: 'IEEE8021-PAE-MIB::dot1xAuthPaeState'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.0.8802.1.1.1.1.2.1.1.1.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: extreme.eapol.walk
              tags:
                - tag: component
                  value: eapol
                - tag: interface
                  value: '{#SNMPINDEX}'
              trigger_prototypes:
                - uuid: 875cb030837741af9037dd8f6cf70f73
                  expression: '{$EAPOLCONTROL:"{#SNMPINDEX}"}=1 and last(/Extreme VOSS by SNMP/extreme.eapol.pae.state[{#SNMPINDEX}])=7'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: '{$EAPOLCONTROL:"{#SNMPINDEX}"}=0 or last(/Extreme VOSS by SNMP/extreme.eapol.pae.state[{#SNMPINDEX}])<>7'
                  name: 'Extreme VOSS: EAPOL {#SNMPINDEX}: Authentication held (failed)'
                  opdata: 'PAE: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    Authenticator PAE is in held(7) after a failed authentication (quiet period).
                    Check client credentials and RADIUS.
                    To ignore this port, set {$EAPOLCONTROL:"{#SNMPINDEX}"}=0 on the host.
                  tags:
                    - tag: scope
                      value: availability
                - uuid: b7a2fa91c65b41e89eb8fd25fdb4ffd7
                  expression: '{$EAPOLCONTROL:"{#SNMPINDEX}"}=1 and min(/Extreme VOSS by SNMP/extreme.eapol.pae.state[{#SNMPINDEX}],15m)=4'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: '{$EAPOLCONTROL:"{#SNMPINDEX}"}=0 or last(/Extreme VOSS by SNMP/extreme.eapol.pae.state[{#SNMPINDEX}])<>4'
                  name: 'Extreme VOSS: EAPOL {#SNMPINDEX}: Stuck authenticating'
                  opdata: 'PAE: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    PAE state has been authenticating(4) for 15 minutes.
                    Check RADIUS reachability and client EAP negotiation.
                    To ignore this port, set {$EAPOLCONTROL:"{#SNMPINDEX}"}=0 on the host.
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 9383d845ba39415186d959ba8363420c
              name: 'Extreme VOSS: EAPOL {#SNMPINDEX}: Backend state'
              type: DEPENDENT
              key: 'extreme.eapol.backend.state[{#SNMPINDEX}]'
              delay: '0'
              history: 30d
              trends: '0'
              description: |
                MIB: IEEE8021-PAE-MIB
                dot1xAuthBackendAuthState — Backend Authentication state machine.
              valuemap:
                name: 'IEEE8021-PAE-MIB::dot1xAuthBackendAuthState'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
