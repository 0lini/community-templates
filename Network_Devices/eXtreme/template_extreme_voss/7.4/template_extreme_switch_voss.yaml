              history: 7d
              trends: '0'
              units: s
              description: |
                MIB: RAPID-CITY
                rcPortBpduGuardTimeout — configured disable duration after a BPDU is received.
                0 means the port is not auto-re-enabled by timer.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2272.1.4.10.1.1.118.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: extreme.rcport.walk
              tags:
                - tag: component
                  value: bpdu-guard
                - tag: interface
                  value: '{#IFNAME}'
