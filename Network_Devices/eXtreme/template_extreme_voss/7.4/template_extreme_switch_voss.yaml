        - uuid: 0eed5d523a9d4f5cb7d6d47ab01c10af
          name: 'Extreme VOSS: NTP server discovery'
          type: DEPENDENT
          key: extreme.ntp.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#NTP.ENABLE}'
                value: '^1$'
                formulaid: A
          description: 'Discovering enabled NTPv4 servers from RAPID-CITY.'
          item_prototypes:
            - uuid: 779a1ae23d93435e88ac88e4e4e11478
              name: 'Extreme VOSS: NTP {#NTP.HOSTNAME}: Sync status'
              type: DEPENDENT
              key: 'extreme.ntp.synchronized[{#SNMPINDEX}]'
              delay: '0'
              history: 30d
              trends: '0'
              value_type: TEXT
              description: |
                MIB: RAPID-CITY
                rcNtpv4ServerSynchronized — CLI sync status for this NTP server
                (e.g. Candidate, Selected, Rejected — not a yes/no flag).
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2272.1.33.4.1.12.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: extreme.ntp.walk
              tags:
                - tag: component
                  value: ntp
                - tag: ntp
                  value: '{#NTP.HOSTNAME}'
              trigger_prototypes:
                - uuid: a76a2d2c257d4187a22531ed9b0131db
                  expression: 'find(/Extreme VOSS by SNMP/extreme.ntp.synchronized[{#SNMPINDEX}],,"regexp","{$NTP.SYNC.PROBLEM.MATCHES}")=1'
                  name: 'Extreme VOSS: NTP {#NTP.HOSTNAME}: Sync problem'
                  opdata: 'Sync: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    NTP server sync status matches {$NTP.SYNC.PROBLEM.MATCHES}
                    (e.g. Rejected / Discarded / not synchronized). Candidate/Selected peers are OK.
                    Check NTP configuration and reachability to this server.
                  dependencies:
                    - name: 'Extreme VOSS: NTP {#NTP.HOSTNAME}: Unreachable'
                      expression: 'find(/Extreme VOSS by SNMP/extreme.ntp.reachable[{#SNMPINDEX}],,"eq","{$NTP.REACHABLE.OK}")=0'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 40632afe7a434a3d9cda0b13df0062b2
              name: 'Extreme VOSS: NTP {#NTP.HOSTNAME}: Reachable'
              type: DEPENDENT
              key: 'extreme.ntp.reachable[{#SNMPINDEX}]'
              delay: '0'
              history: 30d
              trends: '0'
              value_type: TEXT
              description: |
                MIB: RAPID-CITY
                rcNtpv4ServerReachable — reachability status string for this NTP server.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2272.1.33.4.1.13.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: extreme.ntp.walk
              tags:
                - tag: component
                  value: ntp
                - tag: ntp
                  value: '{#NTP.HOSTNAME}'
              trigger_prototypes:
                - uuid: 6774f1efaae145d59745c2a3d2f66ee3
                  expression: 'find(/Extreme VOSS by SNMP/extreme.ntp.reachable[{#SNMPINDEX}],,"eq","{$NTP.REACHABLE.OK}")=0'
                  name: 'Extreme VOSS: NTP {#NTP.HOSTNAME}: Unreachable'
                  opdata: 'Reachable: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    NTP server reachability is not {$NTP.REACHABLE.OK}.
                    Check NTP configuration and network path to this server.
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: extreme.ntp.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#NTP.ENABLE}'
                - 1.3.6.1.4.1.2272.1.33.4.1.3
                - '0'
                - '{#NTP.HOSTNAME}'
                - 1.3.6.1.4.1.2272.1.33.4.1.22
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value);
                  return JSON.stringify(rows.map(function (r) {
                    if (!r['{#NTP.HOSTNAME}']) {
                      r['{#NTP.HOSTNAME}'] = r['{#SNMPINDEX}'];
                    }
                    return r;
                  }));
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 7364dcdcb9544068ad44ccb2965be3c8
          name: 'Extreme VOSS: RADIUS server discovery'
          type: DEPENDENT
          key: extreme.radius.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#RADIUS.ENABLE}'
                value: '^1$'
                formulaid: A
          description: |
            Discovering enabled RADIUS servers from `RAPID-CITY::rcRadiusServHostTable`.
            Index is InetAddressType + InetAddress (with length sub-identifier) + UsedBy
            (cli/snmp/eap/web/endpointTracking).
          item_prototypes:
            - uuid: 206e6fb398ca492dbe19774d3b8cfcf2
              name: 'Extreme VOSS: RADIUS {#RADIUS.SERVER}: Round-trip time'
              type: DEPENDENT
              key: 'extreme.radius.rtt[{#SNMPINDEX}]'
              delay: '0'
              history: 30d
              trends: '0'
              value_type: TEXT
              description: |
                MIB: RAPID-CITY
                rcRadiusServHostRoundTripTime — RTT string from reachability probes (informational).
                Unreachable servers typically report empty / N/A / Unreachable.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2272.1.29.5.1.28.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: extreme.radius.walk
              tags:
                - tag: component
                  value: radius
                - tag: radius
                  value: '{#RADIUS.SERVER}'
                - tag: used-by
                  value: '{#RADIUS.USEDBY}'
            - uuid: 997facdae9bf4da29ba89c88b199bbc0
              name: 'Extreme VOSS: RADIUS {#RADIUS.SERVER}: Pending requests'
              type: DEPENDENT
              key: 'extreme.radius.pending[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: 90d
              description: |
                MIB: RAPID-CITY
                rcRadiusServHostPendingRequests — outstanding access-requests without response.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2272.1.29.5.1.14.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: extreme.radius.walk
              tags:
                - tag: component
                  value: radius
                - tag: radius
                  value: '{#RADIUS.SERVER}'
              trigger_prototypes:
                - uuid: 2227e807a27a4bfe8c6901df2c787afd
                  expression: '{$RADIUSCONTROL:"{#RADIUS.SERVER}"}=1 and min(/Extreme VOSS by SNMP/extreme.radius.pending[{#SNMPINDEX}],10m)>0'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: '{$RADIUSCONTROL:"{#RADIUS.SERVER}"}=0 or last(/Extreme VOSS by SNMP/extreme.radius.pending[{#SNMPINDEX}])=0'
                  name: 'Extreme VOSS: RADIUS {#RADIUS.SERVER}: Pending requests stuck'
                  opdata: 'Pending: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    Access-requests have been pending for 10 minutes. The server is often not responding.
                    To ignore this server, set {$RADIUSCONTROL:"{#RADIUS.SERVER}"}=0 on the host.
                  tags:
                    - tag: scope
                      value: availability
            - uuid: f89c4f4df65c48a8a35055ed5ce7cfc7
              name: 'Extreme VOSS: RADIUS {#RADIUS.SERVER}: Client retries'
              type: DEPENDENT
              key: 'extreme.radius.retries[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              trends: 90d
              value_type: FLOAT
              units: rps
              description: |
                MIB: RAPID-CITY
                rcRadiusServHostClientRetries — authentication retransmissions to this server
                (rate via CHANGE_PER_SECOND; FLOAT so fractional rps below 1 are preserved).
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2272.1.29.5.1.15.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: extreme.radius.walk
              tags:
                - tag: component
                  value: radius
                - tag: radius
                  value: '{#RADIUS.SERVER}'
              trigger_prototypes:
                - uuid: 25086995af8649d59d14cb345b2c6f4e
                  expression: '{$RADIUSCONTROL:"{#RADIUS.SERVER}"}=1 and avg(/Extreme VOSS by SNMP/extreme.radius.retries[{#SNMPINDEX}],10m)>{$RADIUS.RETRIES.WARN}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: '{$RADIUSCONTROL:"{#RADIUS.SERVER}"}=0 or avg(/Extreme VOSS by SNMP/extreme.radius.retries[{#SNMPINDEX}],10m)<={$RADIUS.RETRIES.WARN}'
                  name: 'Extreme VOSS: RADIUS {#RADIUS.SERVER}: High retry rate'
                  event_name: 'Extreme VOSS: RADIUS {#RADIUS.SERVER}: High retry rate (>{$RADIUS.RETRIES.WARN}/s)'
                  opdata: 'Retries/s: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    Elevated RADIUS client retransmission rate. Check server reachability and timeouts.
                    To ignore this server, set {$RADIUSCONTROL:"{#RADIUS.SERVER}"}=0 on the host.
                  tags:
                    - tag: scope
                      value: performance
          master_item:
            key: extreme.radius.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#RADIUS.ENABLE}'
                - 1.3.6.1.4.1.2272.1.29.5.1.6
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var usedByMap = {1: 'cli', 3: 'snmp', 4: 'eap', 5: 'web', 6: 'endpointTracking'};
                  var rows = JSON.parse(value);
                  return JSON.stringify(rows.map(function (r) {
                    // INDEX: InetAddressType, InetAddress (OCTET STRING), UsedBy
                    // SMIv2 encodes InetAddress as T.N.O1..On (length N is required).
                    var parts = String(r['{#SNMPINDEX}']).split('.');
                    var usedByCode = parts[parts.length - 1];
                    var usedBy = usedByMap[usedByCode] || usedByCode;
                    var type = parseInt(parts[0], 10);
                    var len = parseInt(parts[1], 10);
                    var addr = r['{#SNMPINDEX}'];
                    if (!isNaN(type) && !isNaN(len) && len >= 0 && parts.length >= (2 + len + 1)) {
                      var octets = parts.slice(2, 2 + len).map(function (x) { return parseInt(x, 10); });
                      if (type === 1 || type === 3) {
                        // ipv4(1) / ipv4z(3): first 4 octets are the address
                        addr = octets.slice(0, 4).join('.');
                      } else if ((type === 2 || type === 4) && octets.length >= 16) {
                        // ipv6(2) / ipv6z(4): format 8 hextets from 16 octets
                        var groups = [];
                        for (var i = 0; i < 16; i += 2) {
                          groups.push(((octets[i] << 8) | octets[i + 1]).toString(16));
                        }
                        addr = groups.join(':');
                      } else if (octets.length) {
                        addr = octets.join('.');
                      }
                    }
                    return {
                      '{#SNMPINDEX}': r['{#SNMPINDEX}'],
                      '{#RADIUS.ENABLE}': r['{#RADIUS.ENABLE}'],
                      '{#RADIUS.USEDBY}': usedBy,
                      '{#RADIUS.SERVER}': addr + '/' + usedBy
                    };
                  }));
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
