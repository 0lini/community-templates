                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: 4275c98c5fac4c14be6348e15556cd30
                  expression: 'last(/Extreme VOSS by SNMP/extreme.bpdu.guard.shutdown.reason[{#SNMPINDEX}])=20'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Extreme VOSS by SNMP/extreme.bpdu.guard.shutdown.reason[{#SNMPINDEX}])<>20'
                  name: 'Extreme VOSS: BPDU Guard shut interface {#IFNAME}'
                  opdata: 'Reason: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: |
                    BPDU Guard disabled this port after receiving a BPDU (unexpected switch on an edge port).
                    Detected via rcPortShutdownReason=bpduGuard(20). When timeout is 0 the port stays shut
                    until an operator re-enables it (timer count alone would miss that case).
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 8286d7fb22b74548999a19f82b578527
              name: 'Extreme VOSS: BPDU Guard {#IFNAME}: Timer count'
