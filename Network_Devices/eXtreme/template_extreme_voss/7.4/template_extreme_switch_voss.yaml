              history: 30d
              trends: '0'
              description: |
                MIB: RAPID-CITY
                rcIsisCircuitOperState — IS-IS circuit operational state.
                Values: unknown(0), up(1), down(2).
              valuemap:
                name: 'RAPID-CITY::rcIsisCircuitOperState'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2272.1.63.2.1.8.{#SNMPINDEX}'
