              history: 30d
              trends: 90d
              units: s
              description: |
                MIB: RAPID-CITY
                rcPortBpduGuardTimerCount — BPDU Guard disable timer for this port.
                Do not use alone for alerting: when timeout is 0 (infinite), the count stays 0
                while the port remains shut. Use shutdown reason = bpduGuard(20) instead.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2272.1.4.10.1.1.117.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: extreme.rcport.walk
              tags:
                - tag: component
                  value: bpdu-guard
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: b211a59755f0413bae047a7e974c706c
              name: 'Extreme VOSS: BPDU Guard {#IFNAME}: Timeout'
