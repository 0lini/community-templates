                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Extreme VOSS by SNMP/extreme.autosense.state[{#SNMPINDEX}])<>19 and last(/Extreme VOSS by SNMP/extreme.autosense.state[{#SNMPINDEX}])<>23'
