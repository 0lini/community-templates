                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 05b491f2b92a47e6b7ed44aa338702c7
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets with errors'
              type: DEPENDENT
              key: 'net.if.out.errors[{#IFNAME}]'
              delay: '0'
              history: 7d
              trends: 90d
              value_type: FLOAT
              units: eps
              description: |
                MIB: IF-MIB
                ifOutErrors — outbound error rate.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 91646253ef424e19b33a8dd24103ac3b
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
              type: DEPENDENT
              key: 'net.if.out[{#IFNAME}]'
              delay: '0'
              history: 7d
              trends: 90d
              units: bps
              description: |
                MIB: IF-MIB
                ifHCOutOctets — bits transmitted per second.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: d2f985ea1a0c467db32c918bf34f0cef
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound utilization'
              type: CALCULATED
              key: 'net.if.out.util[{#IFNAME}]'
              delay: 1m
              history: 7d
              trends: 90d
              value_type: FLOAT
              units: '%'
              params: 'last(//net.if.out[{#IFNAME}])/(last(//net.if.speed[{#IFNAME}])+(last(//net.if.speed[{#IFNAME}])=0))*100*(last(//net.if.speed[{#IFNAME}])>0)'
              description: |
                Outbound bandwidth utilization in % of interface speed.
                When ifHighSpeed is 0 (common on oper-down ports), result is 0 — avoids division by zero.
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 9aec902203764232ba2129c788d4bc14
              name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
              type: DEPENDENT
              key: 'net.if.speed[{#IFNAME}]'
              delay: '0'
              history: 7d
              trends: '0'
              units: bps
              description: |
                MIB: IF-MIB
                ifHighSpeed — estimate of current bandwidth (stored as bits per second).
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: d7e235a618d748d4b694c22aa2780b3f
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
              type: DEPENDENT
              key: 'net.if.status[{#IFNAME}]'
              delay: '0'
              history: 7d
              trends: '0'
              description: |
                MIB: IF-MIB
                ifOperStatus — current operational state of the interface.
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: c1511d298ddc4054bfe09b732c9c667b
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}])=2 and (last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}],#1)<>last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    This trigger expression works as follows:
                    1. It can be triggered if the operational status is down.
                    2. `{$IFCONTROL:"{#IFNAME}"}=1` - a user can redefine the context macro to 0. That marks this interface as not important. No new trigger will fire if this interface is down.
                    3. The trigger fires only if the operational status changed to down (so it does not fire for permanently down interfaces).

                    WARNING: if closed manually - it will not fire again on the next poll, because of the change check.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
          trigger_prototypes:
            - uuid: ec3ac4fb300845919da40c656296e3b3
              expression: 'avg(/Extreme VOSS by SNMP/net.if.in.util[{#IFNAME}],5m)>{$IF.UTIL.WARN:"{#IFNAME}"} or avg(/Extreme VOSS by SNMP/net.if.out.util[{#IFNAME}],5m)>{$IF.UTIL.WARN:"{#IFNAME}"}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/Extreme VOSS by SNMP/net.if.in.util[{#IFNAME}],5m)<={$IF.UTIL.WARN:"{#IFNAME}"}-5 and avg(/Extreme VOSS by SNMP/net.if.out.util[{#IFNAME}],5m)<={$IF.UTIL.WARN:"{#IFNAME}"}-5'
              name: 'Interface {#IFNAME}({#IFALIAS}): High bandwidth utilization'
              event_name: 'Interface {#IFNAME}({#IFALIAS}): High bandwidth utilization (>{$IF.UTIL.WARN:"{#IFNAME}"}%)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: |
                Inbound or outbound utilization over 5 minutes exceeds {$IF.UTIL.WARN:"{#IFNAME}"}%.
                It recovers when both directions stay at least 5% below the threshold.
              dependencies:
                - name: 'Interface {#IFNAME}({#IFALIAS}): Critical bandwidth utilization'
                  expression: 'avg(/Extreme VOSS by SNMP/net.if.in.util[{#IFNAME}],5m)>{$IF.UTIL.CRIT:"{#IFNAME}"} or avg(/Extreme VOSS by SNMP/net.if.out.util[{#IFNAME}],5m)>{$IF.UTIL.CRIT:"{#IFNAME}"}'
                - name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}])=2 and (last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}],#1)<>last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}],#2))'
              tags:
                - tag: scope
                  value: performance
            - uuid: 6f747c76da5341039650c1647e533650
              expression: 'avg(/Extreme VOSS by SNMP/net.if.in.util[{#IFNAME}],5m)>{$IF.UTIL.CRIT:"{#IFNAME}"} or avg(/Extreme VOSS by SNMP/net.if.out.util[{#IFNAME}],5m)>{$IF.UTIL.CRIT:"{#IFNAME}"}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/Extreme VOSS by SNMP/net.if.in.util[{#IFNAME}],5m)<={$IF.UTIL.CRIT:"{#IFNAME}"}-5 and avg(/Extreme VOSS by SNMP/net.if.out.util[{#IFNAME}],5m)<={$IF.UTIL.CRIT:"{#IFNAME}"}-5'
              name: 'Interface {#IFNAME}({#IFALIAS}): Critical bandwidth utilization'
              event_name: 'Interface {#IFNAME}({#IFALIAS}): Critical bandwidth utilization (>{$IF.UTIL.CRIT:"{#IFNAME}"}%)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE2}'
              priority: HIGH
              description: |
                Inbound or outbound utilization over 5 minutes exceeds {$IF.UTIL.CRIT:"{#IFNAME}"}%.
                It recovers when both directions stay at least 5% below the threshold.
              dependencies:
                - name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}])=2 and (last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}],#1)<>last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}],#2))'
              tags:
                - tag: scope
                  value: performance
            - uuid: 8ef017197e8e4ffab19b1fbc6c5c54f6
              expression: 'avg(/Extreme VOSS by SNMP/net.if.in.errors[{#IFNAME}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"} or avg(/Extreme VOSS by SNMP/net.if.out.errors[{#IFNAME}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/Extreme VOSS by SNMP/net.if.in.errors[{#IFNAME}],5m)<={$IF.ERRORS.WARN:"{#IFNAME}"}-0.5 and avg(/Extreme VOSS by SNMP/net.if.out.errors[{#IFNAME}],5m)<={$IF.ERRORS.WARN:"{#IFNAME}"}-0.5'
              name: 'Interface {#IFNAME}({#IFALIAS}): High error rate'
              event_name: 'Interface {#IFNAME}({#IFALIAS}): High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} eps)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: |
                Inbound or outbound error rate over 5 minutes exceeds {$IF.ERRORS.WARN:"{#IFNAME}"}.
                It recovers when both directions stay below the threshold minus 0.5.
              dependencies:
                - name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}])=2 and (last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}],#1)<>last(/Extreme VOSS by SNMP/net.if.status[{#IFNAME}],#2))'
              tags:
