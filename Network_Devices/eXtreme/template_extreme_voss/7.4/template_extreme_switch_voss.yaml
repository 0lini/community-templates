zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 36b09332e8a1482ca20153784742aac5
      template: 'Extreme VOSS by SNMP'
      name: 'Extreme VOSS by SNMP'
      description: |
        Template Extreme VOSS by SNMP

        Monitoring of Extreme Networks VOSS / Fabric Engine switches via SNMPv2c or SNMPv3.

        MIBs used:
        RAPID-CITY
        ENTITY-MIB
        IF-MIB
        IEEE8021-PAE-MIB
        SNMPv2-MIB

        Collection uses master SNMP walk[] / get[] items with dependent discovery and metrics (Zabbix 7.4+).

        Note: Legacy rcSysCpuUtil / rcSysDram* are not supported on VOSS. CPU and memory use RAPID-CITY::rcKhiSlotPerfTable.

        OID reference: VOSS 9.4.1 MIBs.

        Author: Jon McLaughlin
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 3d3f99531f5c4b7bba80b3bb3af2da7a
          name: 'Extreme VOSS: ICMP ping'
          type: SIMPLE
          key: icmpping
          history: 1w
          trends: '0'
          description: 'The host ICMP availability. Primary availability check.'
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 31613162065a41e5b7dc8bfcba59e71a
              expression: 'max(/Extreme VOSS by SNMP/icmpping,#3)=0'
              name: 'Extreme VOSS: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 0dde99b52f034319b00127c63e469df1
          name: 'Extreme VOSS: ICMP loss'
          type: SIMPLE
          key: icmppingloss
          history: 1w
          value_type: FLOAT
          units: '%'
          description: 'The ICMP packet loss in percent.'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 4e85fce1b35640329d5c6721fd953d99
              expression: 'min(/Extreme VOSS by SNMP/icmppingloss,5m)>{$ICMP.LOSS.WARN} and min(/Extreme VOSS by SNMP/icmppingloss,5m)<100'
              name: 'Extreme VOSS: High ICMP ping loss'
              event_name: 'Extreme VOSS: High ICMP ping loss (>{$ICMP.LOSS.WARN}%)'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packet loss over 5 minutes exceeds {$ICMP.LOSS.WARN}%.'
              dependencies:
                - name: 'Extreme VOSS: Unavailable by ICMP ping'
                  expression: 'max(/Extreme VOSS by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: e6ee615d5f354406bc9154f44585ee39
          name: 'Extreme VOSS: ICMP response time'
          type: SIMPLE
          key: icmppingsec
          history: 1w
          value_type: FLOAT
          units: s
          description: 'The ICMP echo response time.'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 77636fd6f18d49a3a8e503b455ac41a8
              expression: 'avg(/Extreme VOSS by SNMP/icmppingsec,5m)>{$ICMP.RESPONSE.TIME.WARN}'
              name: 'Extreme VOSS: High ICMP ping response time'
              event_name: 'Extreme VOSS: High ICMP ping response time (>{$ICMP.RESPONSE.TIME.WARN}s)'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time over 5 minutes exceeds {$ICMP.RESPONSE.TIME.WARN}s.'
              dependencies:
                - name: 'Extreme VOSS: High ICMP ping loss'
                  expression: 'min(/Extreme VOSS by SNMP/icmppingloss,5m)>{$ICMP.LOSS.WARN} and min(/Extreme VOSS by SNMP/icmppingloss,5m)<100'
                - name: 'Extreme VOSS: Unavailable by ICMP ping'
                  expression: 'max(/Extreme VOSS by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 831d193d2bab4f9a835ba3433dd18727
          name: 'Extreme VOSS: SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 7d
          description: |
            Availability of SNMP checks on the host as reported by Zabbix (same as the host availability icon).
            Values: not available (0), available (1), unknown (2).
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 41cacf5db63d4fe39dee0ff373842d40
              expression: 'max(/Extreme VOSS by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Extreme VOSS: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'SNMP is not available for polling for {$SNMP.TIMEOUT}. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'Extreme VOSS: Unavailable by ICMP ping'
                  expression: 'max(/Extreme VOSS by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: 3b53222520694a1b905ccae31578e446
          name: 'Extreme VOSS: SNMP walk KHI slot performance'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2272.1.85.10.1.1.2,1.3.6.1.4.1.2272.1.85.10.1.1.6,1.3.6.1.4.1.2272.1.85.10.1.1.7,1.3.6.1.4.1.2272.1.85.10.1.1.8]'
          key: extreme.khi.slot.walk
          delay: 3m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: RAPID-CITY
            Scanning of `RAPID-CITY::rcKhiSlotPerfTable` for dependent CPU and memory metrics.
          tags:
            - tag: component
              value: raw
        - uuid: 1c0bcca0ad7b4321b335fe5a2b7f802b
          name: 'Extreme VOSS: SNMP walk network interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.31.1.1.1.15]'
          key: net.if.walk
          delay: 1m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: IF-MIB
            Scanning of IF-MIB interface tables for dependent discovery and metrics.
          tags:
            - tag: component
              value: raw
        - uuid: a312ec2db65749419aaba5ff61e193b9
          name: 'Extreme VOSS: SNMP walk ENTITY-MIB'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.47.1.1.1.1.5,1.3.6.1.2.1.47.1.1.1.1.11,1.3.6.1.2.1.47.1.1.1.1.13,1.3.6.1.2.1.47.1.1.1.1.9]'
          key: system.hw.entities.walk
          delay: 1h
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: ENTITY-MIB
            Scanning of ENTITY-MIB physical entities for chassis inventory discovery.
          tags:
            - tag: component
              value: raw
        - uuid: 0072445a705e4b3d83b9266e0cd2f3cc
          name: 'Extreme VOSS: SNMP walk temperature sensors'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2272.1.101.1.1.2.1.2,1.3.6.1.4.1.2272.1.101.1.1.2.1.3,1.3.6.1.4.1.2272.1.101.1.1.2.1.4,1.3.6.1.4.1.2272.1.101.1.1.2.1.5,1.3.6.1.4.1.2272.1.101.1.1.2.1.6]'
          key: extreme.temp.walk
          delay: 3m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: RAPID-CITY
            Scanning of `RAPID-CITY::rcVossSystemTemperatureTable`.
          tags:
            - tag: component
              value: raw
        - uuid: 897aead9e7bd463eb3b12ab1d82cf89e
          name: 'Extreme VOSS: SNMP walk fans'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2272.1.101.1.1.4.1.3,1.3.6.1.4.1.2272.1.101.1.1.4.1.4,1.3.6.1.4.1.2272.1.101.1.1.4.1.5,1.3.6.1.4.1.2272.1.101.1.1.4.1.6]'
          key: extreme.fan.walk
          delay: 5m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: RAPID-CITY
            Scanning of `RAPID-CITY::rcVossSystemFanInfoTable`.
          tags:
            - tag: component
              value: raw
        - uuid: f9d949bcb24d478f9de5f2b6de56dce0
          name: 'Extreme VOSS: SNMP walk power supplies'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2272.1.4.8.1.1.2]'
          key: extreme.psu.walk
          delay: 5m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: RAPID-CITY
            Scanning of `RAPID-CITY::rcChasPowerSupplyTable`.
          tags:
            - tag: component
              value: raw
        - uuid: 943b258f29ea4db2b8050373197d55f2
          name: 'Extreme VOSS: System description'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.1.0]'
          key: 'system.descr[sysDescr.0]'
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            sysDescr — textual description of the entity.
          inventory_link: SOFTWARE_FULL
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 65ee895c9d83492eb12fcdd3fb20c443
          name: 'Extreme VOSS: System name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: 'system.name[sysName.0]'
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            sysName — administratively assigned name for this managed node.
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 1d35aaa6d18e4b1c8c68dd0d64a3816d
          name: 'Extreme VOSS: System location'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: 'system.location[sysLocation.0]'
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            sysLocation — physical location of this node.
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: a0e84b68303b402785030986c55a7b74
          name: 'Extreme VOSS: System uptime'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.uptime[sysUpTime.0]'
          delay: 5m
          history: 7d
          trends: 90d
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            sysUpTime — time since the network management portion of the system was last re-initialized.
            SNMP TimeTicks are converted to seconds (× 0.01).
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 62e1f63b7a484ec1be637d5dabd4fff5
              expression: 'last(/Extreme VOSS by SNMP/system.uptime[sysUpTime.0])<10m'
              name: 'Extreme VOSS: Device has been restarted'
              priority: WARNING
              manual_close: 'YES'
              description: 'Device uptime is less than 10 minutes. Acknowledge to close the problem manually.'
              tags:
                - tag: scope
                  value: notice
        - uuid: ec347a0b208a4241a6bbb7b3cc67c0fc
          name: 'Extreme VOSS: SNMP walk Virtual IST'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2272.1.211.1,1.3.6.1.4.1.2272.1.211.3]'
          key: extreme.vist.walk
          delay: 3m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: RAPID-CITY
            Scanning of Virtual IST objects (`rcVirtualIstSessionStatus`, `rcVirtualIstVlanId`).
            Feeds vIST discovery (metrics only when a vIST VLAN is configured).
          tags:
            - tag: component
              value: raw
        - uuid: 4d0b59d7c17646db84faf6311d5c2daa
          name: 'Extreme VOSS: SNMP walk SLPP Guard'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2272.1.64.1.1.3.1.8,1.3.6.1.4.1.2272.1.64.1.1.3.1.10,1.3.6.1.4.1.2272.1.64.1.1.3.1.9,1.3.6.1.4.1.2272.1.64.1.1.3.1.11,1.3.6.1.4.1.2272.1.64.1.1.3.1.7]'
          key: extreme.slpp.guard.walk
          delay: 3m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: RAPID-CITY
            Scanning of `RAPID-CITY::rcSlppPortTable` SLPP Guard columns. Item labels use ifIndex (`{#SNMPINDEX}`).
          tags:
            - tag: component
              value: raw
        - uuid: b1312dec0be04098ab0fdec576ea0cc2
          name: 'Extreme VOSS: SNMP walk rcPort (BPDU Guard / Auto-Sense)'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2272.1.4.10.1.1.119,1.3.6.1.4.1.2272.1.4.10.1.1.114,1.3.6.1.4.1.2272.1.4.10.1.1.117,1.3.6.1.4.1.2272.1.4.10.1.1.118,1.3.6.1.4.1.2272.1.4.10.1.1.130,1.3.6.1.4.1.2272.1.4.10.1.1.134,1.3.6.1.2.1.31.1.1.1.1]'
          key: extreme.rcport.walk
          delay: 3m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: RAPID-CITY / IF-MIB
            Shared scanning of `RAPID-CITY::rcPortTable` BPDU Guard (enable/reason/timer/timeout),
            Auto-Sense columns, plus ifName.
          tags:
            - tag: component
              value: raw
        - uuid: b9b9ca4ad1e44dd6b9a88f8e0f177a95
          name: 'Extreme VOSS: SNMP walk EAPOL / 802.1X'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.0.8802.1.1.1.1.2.1.1.6,1.0.8802.1.1.1.1.2.1.1.5,1.0.8802.1.1.1.1.2.1.1.1,1.0.8802.1.1.1.1.2.1.1.2]'
          key: extreme.eapol.walk
          delay: 3m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: IEEE8021-PAE-MIB
            Scanning of Authenticator PAE objects (PortControl, PortStatus, PaeState, BackendAuthState).
            Item labels use ifIndex (`{#SNMPINDEX}`).
          tags:
            - tag: component
              value: raw
        - uuid: c0e5c1b1ff134649bbd0446d5b7fd9a7
          name: 'Extreme VOSS: SNMP walk MLT'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2272.1.17.10.1.2,1.3.6.1.4.1.2272.1.17.10.1.8,1.3.6.1.4.1.2272.1.17.10.1.18,1.3.6.1.4.1.2272.1.17.10.1.22]'
          key: extreme.mlt.walk
          delay: 3m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: RAPID-CITY
            Scanning of `RAPID-CITY::rcMltTable` (name, enable, aggregatable, aggregation oper state).
          tags:
            - tag: component
              value: raw
        - uuid: b5038d811e7c4e2289808131a2ec8174
          name: 'Extreme VOSS: SNMP walk classic IST'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2272.1.17.3,1.3.6.1.4.1.2272.1.17.4]'
          key: extreme.ist.walk
          delay: 3m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: RAPID-CITY
            Scanning of classic IST objects (`rcMltIstSessionEnable`, `rcMltIstSessionStatus`).
          tags:
            - tag: component
              value: raw
        - uuid: ebb3d4c6af224801a4c7491abe388491
          name: 'Extreme VOSS: SNMP walk IS-IS circuits'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2272.1.63.2.1.2,1.3.6.1.4.1.2272.1.63.2.1.8,1.3.6.1.4.1.2272.1.63.2.1.9,1.3.6.1.4.1.2272.1.63.2.1.10]'
          key: extreme.isis.circuit.walk
          delay: 3m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: RAPID-CITY
            Scanning of `RAPID-CITY::rcIsisCircuitTable` (type, oper state, adjacency counts).
          tags:
            - tag: component
              value: raw
        - uuid: f930f7ecc5ec4099b351f63df37f9ead
          name: 'Extreme VOSS: SNMP walk NTP'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2272.1.33.4.1.3,1.3.6.1.4.1.2272.1.33.4.1.12,1.3.6.1.4.1.2272.1.33.4.1.13,1.3.6.1.4.1.2272.1.33.4.1.22]'
          key: extreme.ntp.walk
          delay: 5m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: RAPID-CITY
            Scanning of NTPv4 server table (enable, synchronized, reachable, hostname).
          tags:
            - tag: component
              value: raw
        - uuid: d58463461aac4b20a8d908c78aedc687
          name: 'Extreme VOSS: SNMP walk RADIUS servers'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.2272.1.29.5.1.6,1.3.6.1.4.1.2272.1.29.5.1.14,1.3.6.1.4.1.2272.1.29.5.1.15,1.3.6.1.4.1.2272.1.29.5.1.28]'
          key: extreme.radius.walk
          delay: 5m
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |
            MIB: RAPID-CITY
            Scanning of `RAPID-CITY::rcRadiusServHostTable` (enable, pending, retries, RTT).
          tags:
            - tag: component
              value: raw
      discovery_rules:
        - uuid: 7db383e948b8448cb43bf678ad295cc9
          name: 'Extreme VOSS: Virtual IST discovery'
          type: DEPENDENT
          key: extreme.vist.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#VIST.VLAN}'
                value: '^[1-9][0-9]*$'
                formulaid: A
          description: |
            Discovering Virtual IST from RAPID-CITY when `rcVirtualIstVlanId` is non-zero.
            Standalone switches without vIST create no items or triggers.
          item_prototypes:
            - uuid: 24de6d9bef5d415383b4b88cc2e04db6
              name: 'Extreme VOSS: vIST session status'
              type: DEPENDENT
              key: 'extreme.vist.session.status[{#SNMPINDEX}]'
              delay: '0'
              history: 30d
              trends: '0'
              description: |
                MIB: RAPID-CITY
                rcVirtualIstSessionStatus — Virtual Inter-Switch Trunk (vIST) session state.
                Values: up(1), down(2). Created only when a vIST VLAN is configured.
              valuemap:
                name: 'RAPID-CITY::rcVirtualIstSessionStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.2272.1.211.1.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: extreme.vist.walk
              tags:
                - tag: component
                  value: vist
              trigger_prototypes:
                - uuid: 46c2c734cef347f091919c43b418faed
                  expression: 'last(/Extreme VOSS by SNMP/extreme.vist.session.status[{#SNMPINDEX}])=2'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Extreme VOSS by SNMP/extreme.vist.session.status[{#SNMPINDEX}])=1'
                  name: 'Extreme VOSS: vIST session is DOWN'
                  opdata: 'Status: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'Virtual IST session between SMLT/vIST peers is down. Check vIST VLAN, peer reachability, and IST state.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: extreme.vist.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#VIST.VLAN}'
                - 1.3.6.1.4.1.2272.1.211.3
                - '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: fd29f43774174cd2a1145f69dca8984d
          name: 'Extreme VOSS: SLPP Guard discovery'
          type: DEPENDENT
          key: extreme.slpp.guard.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#SLPP.GUARD.ENABLE}'
                value: '^1$'
                formulaid: A
          description: 'Discovering SLPP Guard-enabled ports from `RAPID-CITY::rcSlppPortTable`.'
          item_prototypes:
            - uuid: 7a8e2db3edf44fd7b8f0ba789444f582
              name: 'Extreme VOSS: SLPP Guard {#SNMPINDEX}: Status'
              type: DEPENDENT
              key: 'extreme.slpp.guard.status[{#SNMPINDEX}]'
              delay: '0'
              history: 30d
              trends: '0'
