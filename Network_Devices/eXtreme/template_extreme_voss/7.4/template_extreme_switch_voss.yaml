                    - '0'
              master_item:
                key: extreme.eapol.walk
              tags:
                - tag: component
                  value: eapol
                - tag: interface
                  value: '{#SNMPINDEX}'
              trigger_prototypes:
                - uuid: 0adbc3cc913a460bbf4ec4f2217da5db
                  expression: '{$EAPOLCONTROL:"{#SNMPINDEX}"}=1 and (last(/Extreme VOSS by SNMP/extreme.eapol.backend.state[{#SNMPINDEX}])=4 or last(/Extreme VOSS by SNMP/extreme.eapol.backend.state[{#SNMPINDEX}])=5)'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: '{$EAPOLCONTROL:"{#SNMPINDEX}"}=0 or (last(/Extreme VOSS by SNMP/extreme.eapol.backend.state[{#SNMPINDEX}])<>4 and last(/Extreme VOSS by SNMP/extreme.eapol.backend.state[{#SNMPINDEX}])<>5)'
                  name: 'Extreme VOSS: EAPOL {#SNMPINDEX}: Backend auth fail / timeout'
                  opdata: 'Backend: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    Backend Authentication reports fail(4) or timeout(5).
                    Typically a RADIUS reject or unreachable server.
                    To ignore this port, set {$EAPOLCONTROL:"{#SNMPINDEX}"}=0 on the host.
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: extreme.eapol.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#EAPOL.CONTROL}'
                - 1.0.8802.1.1.1.1.2.1.1.6
                - '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
